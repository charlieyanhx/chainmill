[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chainmill"
version = "0.1.0"
description = "Parallel extraction of zipped option-chain archives into a queryable SQLite store."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Charlie Yan" }]
keywords = ["options", "market-data", "etl", "map-reduce", "sqlite", "quant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=1.5"]

[project.optional-dependencies]
parquet = ["pyarrow>=10.0"]
test = ["pytest>=7.0", "pyarrow>=10.0"]

[project.urls]
Homepage = "https://github.com/charlieyanhx/chainmill"
Issues = "https://github.com/charlieyanhx/chainmill/issues"

[tool.hatch.build.targets.wheel]
packages = ["chainmill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
